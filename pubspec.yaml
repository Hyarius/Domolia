name: domolia
description: Application de jeu de role narratif pour Android.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.3.2
  crypto: ^3.0.6
  jose: ^0.3.5+2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.3.4
  http: ^1.6.0
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/domolia_emblem.png
