name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compiler et tester l'APK
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.signing.outputs.configured }}

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer la plateforme Android
        run: flutter create --no-pub --platforms=android --org=fr.domolia --project-name=domolia .

      - name: Installer les dépendances
        run: flutter pub get

      - name: Analyse statique
        run: flutter analyze

      - name: Tests
        run: flutter test

      # Les secrets ne sont jamais fournis aux builds de PR.
      # Sur main, l'APK de développement est signé avec la clé release
      # si elle existe, sinon il reste un APK debug d'installation ponctuelle.
      # Sur les tags v*, la signature release est obligatoire.
      - name: Configurer la signature release
        id: signing
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          fields=(ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD)
          supplied=0
          for field in "${fields[@]}"; do
            if [ -n "${!field}" ]; then
              supplied=$((supplied + 1))
            fi
          done

          if [ "$supplied" -eq 0 ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::Les quatre secrets Android sont obligatoires pour les versions stables."
              exit 1
            fi
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::APK de développement debug : les futures versions peuvent nécessiter une désinstallation."
            exit 0
          fi

          if [ "$supplied" -ne 4 ]; then
            echo "::error::Signature partielle : configurer les quatre secrets Android."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties
          python3 tool/enable_release_signing.py
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Compiler l'APK debug
        if: github.event_name == 'pull_request' || steps.signing.outputs.configured != 'true'
        run: flutter build apk --debug --build-number="${{ github.run_number }}"

      - name: Compiler l'APK release signé
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.1.0"
          fi
          flutter build apk --release \
            --build-name="$version" \
            --build-number="${GITHUB_RUN_NUMBER}"

      - name: Préparer l'APK à télécharger
        shell: bash
        run: |
          mkdir -p dist
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            cp build/app/outputs/flutter-apk/app-release.apk dist/Domolia.apk
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
              cp build/app/outputs/flutter-apk/app-release.apk dist/Domolia-dev.apk
            else
              cp build/app/outputs/flutter-apk/app-debug.apk dist/Domolia-dev.apk
            fi
          else
            cp build/app/outputs/flutter-apk/app-debug.apk dist/Domolia-debug.apk
          fi

      - name: Conserver l'APK comme artifact GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: domolia-apk-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  dev-latest:
    name: Publier dev-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      - name: Télécharger l'APK construit
        uses: actions/download-artifact@v4
        with:
          name: domolia-apk-${{ github.run_number }}
          path: dist

      - name: Vérifier l'APK
        shell: bash
        run: test -s dist/Domolia-dev.apk

      - name: Créer ou mettre à jour la release dev-latest
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ needs.build.outputs.signed }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          ## Domolia — développement

          **Commit :** \`$GITHUB_SHA\`
          **Build :** \`$GITHUB_RUN_NUMBER\`

          [Télécharger l'APK de développement](https://github.com/$GITHUB_REPOSITORY/releases/download/dev-latest/Domolia-dev.apk)

          Chaque push sur \`main\` remplace cet APK, après compilation et tests réussis.
          EOF

          if [ "$SIGNED" = "true" ]; then
            printf '\n**Signature :** release persistante. Les mises à jour peuvent conserver les données si la même clé et le même identifiant Android sont utilisés.\n' >> release-notes.md
          else
            printf '\n**Signature :** debug temporaire. Une autre compilation peut exiger une désinstallation, avec perte des données locales. Configurez les secrets Android pour des mises à jour durables.\n' >> release-notes.md
          fi

          # Tag mobile uniquement pour le canal de développement.
          # Le déclencheur est limité aux tags v*, donc pas de récursion.
          git tag -f dev-latest "$GITHUB_SHA"
          git push --force origin refs/tags/dev-latest

          if gh release view dev-latest >/dev/null 2>&1; then
            gh release upload dev-latest dist/Domolia-dev.apk --clobber
            gh release edit dev-latest \
              --title "Domolia — dev-latest" \
              --prerelease \
              --latest=false \
              --notes-file release-notes.md
          else
            gh release create dev-latest dist/Domolia-dev.apk \
              --verify-tag \
              --title "Domolia — dev-latest" \
              --prerelease \
              --latest=false \
              --notes-file release-notes.md
          fi

  stable-release:
    name: Publier la version stable
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Télécharger l'APK signé
        uses: actions/download-artifact@v4
        with:
          name: domolia-apk-${{ github.run_number }}
          path: dist

      - name: Créer la GitHub Release stable
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Domolia.apk
          generate_release_notes: true
